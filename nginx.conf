server {
    listen 80;
    listen [::]:80;
    server_name egova.my.id www.egova.my.id localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck Endpoint for Homeserver / Docker / Cloudflare Tunnel
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK - egova.my.id\n";
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Main SPA / Static routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
